<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="t d">
<title id="t">Judgment windows · M-02</title>
<desc id="d">Signed error in ms (press time minus note time). Solid bands are observed in note_manager.gd:9-11, 68-126. The dashed late-miss band exists in code but is effectively unreachable because notes auto-miss after +150 ms. IDs: M-01, M-02, F-01, Q-06.</desc>
