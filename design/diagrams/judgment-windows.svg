<text x="40" y="500" font-size="14" fill="#5b6b7c">Verified with a constructed fixture (FRICTIONAL 04:16): 0 and ±50 ms Perfect, ±100 ms Good, −200 ms early Miss. The +200 ms case has no test (T-20).</text>
<text x="40" y="524" font-size="14" fill="#5b6b7c">Graph and stats: Perfect yellow, Good sky blue, Miss dark red; misses drawn just outside ±150 ms (main.gd:195-211).</text>
