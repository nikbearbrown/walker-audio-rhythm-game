<text x="620" y="636.0" font-size="12" text-anchor="middle" fill="#5b6b7c">H-01 · never measured</text>
<text x="40" y="670" font-size="13" fill="#5b6b7c">Measured (FRICTIONAL 09:33): real CoreAudio, ~5 s, raw −0.76 ms and filtered +2.55 ms vs wall time. Headless Dummy audio drifted ~0.4 s (09:02). Engine clocks, not ears.</text>
