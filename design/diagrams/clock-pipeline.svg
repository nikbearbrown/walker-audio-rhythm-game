<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="720" viewBox="0 0 1580 720" role="img" aria-labelledby="t d">
<title id="t">Clock pipeline · S-01</title>
<desc id="d">Audio time is truthful but jittery; system time is smooth but drifts. The 1€ filter smooths their difference. Solid: code. Dashed: what a person hears, never measured. IDs: S-01, M-02, M-03, M-09, F-09.</desc>
